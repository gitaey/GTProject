name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build check
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 19922
          command_timeout: 30m
          script: |
            set -e
            cd /gtp/GTProject
            git pull origin master

            cd /gtp/GTProject/frontend
            docker run --rm \
              -v $(pwd):/app \
              -w /app \
              node:18 \
              sh -c "npm install && npm run build"

            docker stop gtp-frontend 2>/dev/null || true
            docker rm gtp-frontend 2>/dev/null || true
            docker run -d \
              --name gtp-frontend \
              --restart always \
              -v /gtp/GTProject/frontend:/app \
              -w /app \
              -p 49092:3000 \
              -e NODE_ENV=production \
              node:18 \
              sh -c "npm start"

            echo "프론트엔드 배포 완료"
