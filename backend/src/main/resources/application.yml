spring:
  output:
    ansi:
      enabled: always

  datasource:
    url: ${DB_URL:jdbc:postgresql://:49091/gtp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8080
  compression:                # 바람길(수 MB JSON) 등 큰 JSON 응답을 gzip으로 전송. nginx가 그대로 전달한다
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 2KB
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  tomcat:
    max-swallow-size: -1

jwt:
  secret: ${JWT_SECRET:gtp-secret-key-for-jwt-token-generation-2024-long-enough}
  expiration: 86400000  # 24시간

google:
  sheets:
    spreadsheet-id: 1_i5MeUeQkEXX3cwP1_JH-bSqkx-EoE7smbYTxegm0Vk
    credentials-path: classpath:google-credentials.json
    credentials-json: ${GOOGLE_CREDENTIALS_JSON:}
    sheet-name: 레이드일정
    character-sheet-name: 캐릭터

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN:}

lostark:
  api:
    key: ${LOSTARK_API_KEY:}

geotiff:
  upload-dir: ${GEOTIFF_UPLOAD_DIR:./geotiff-uploads}

mymap:
  upload-dir: ${MYMAP_UPLOAD_DIR:./mymap-uploads}
  limits:
    max-layers-per-user: 20
    max-rows-pnu: 5000
    max-rows-address: 5000
    max-rows-coord: 5000
    max-shp-features: 100000
    max-excel-mb: 10
    max-shp-mb: 300
  ref:                                # 참조 데이터(연속지적도 등). 앱은 읽기만 한다 — 적재는 backend/scripts/mymap-ref
    provider: postgis                 # postgis | fake (시험·로컬 개발 — 전국 데이터 없이 가짜 사각형 필지)
    allowed-sido-codes: ""            # 비우면 전국. 지역 제한이 필요하면 "36,30,44,43"처럼(설정 훅)
    expected-sido-codes: "11,12,26,27,28,30,31,36,41,43,44,47,48,50,51,52"   # "전국" 기준(VWorld 2026-10, 12 = 전남광주통합). 적재 기록에 전부 있어야 한도 응답 nationwide=true
    parcel:
      table: ref.lsmd_cont_ldreg
      pnu-column: pnu
      jibun-column: jibun
      sido-column: sido
      geom-column: geom
      srid: 4326
    address:                          # 주소 엑셀(도로명주소·지번주소 → PNU) — 도로명주소 건물DB (backend/scripts/mymap-ref/load-juso.sh)
      building-table: ref.ti_spbd_buld   # 건물정보: 법정동 사전(메모리)·도로명주소 → 지번
      road-code-table: ref.ti_sprd_stret # 도로명코드: 도로명 → road_cd
      max-candidates: 5                  # AMBIGUOUS 후보를 보고서에 남기는 최대 개수
    load-meta-table: ref.load_meta
    datasource:                       # 비우면 서비스 DataSource. 별도 DB로 옮길 때만 환경 변수로 채운다(값은 저장소에 쓰지 않는다)
      url: ${MYMAP_REF_DB_URL:}
      username: ${MYMAP_REF_DB_USERNAME:}
      password: ${MYMAP_REF_DB_PASSWORD:}
  maintenance:
    enabled: ${MYMAP_MAINTENANCE_ENABLED:true}   # 로컬이 운영 DB를 볼 때는 false 권장(기동 때 멈춘 레이어 정리가 운영 행을 건드린다)

titiler:
  url: ${TITILER_URL:http://localhost:8000}
  container-name: ${TITILER_CONTAINER_NAME:gtp-titiler-local}

geoserver:
  url: ${GEOSERVER_URL:https://geo.gitaey-dev.com/geoserver}
  admin:
    user: ${GEOSERVER_ADMIN_USER:admin}
    password: ${GEOSERVER_ADMIN_PASSWORD:sis3047!@}
  legend-layer: ${GEOSERVER_LEGEND_LAYER:gtp:tl_scco_ctprvn}

# 바람길 레이어 (기상청 LDAPS 국지예보모델 약 1km 격자, 하루 4회 발표 KST 03·09·15·21시 — 매시 30분에 갱신을 시도한다)
wind:
  forecast-hours: 15           # leadHour 0~14 (발표시각부터 15시간, 사이클당 시간별 프레임 개수 = 사이클이 "완전하다"는 기준). LDAPS는 발표 후 약 6.5시간 뒤에 받을 수 있고 다음 발표분은 6시간 뒤라, 이 값이 약 13 미만이면 "지금" 자료가 없는 구간이 생긴다
  fields: temp,humi            # 바람 외에 받을 스칼라 변수(temp 기온·humi 습도·rain 강수량). 비우면 호출 0 — 기상청 일일 호출 한도를 아끼는 손잡이. rain은 시간당/누적 의미 미확인이라 기본에서 뺌
  output:
    resolution-deg: 0.02       # 재격자 결과 격자 간격(도), 0.02도 ≈ 2km (출력 칸마다 원본 격자를 이중선형 보간)

# 기상청 API허브 (LDAPS 국지예보모델)
kma:
  api-key: ${KMA_API_KEY}
  base-url: https://apihub.kma.go.kr/api/typ02/openApi/KIMModelInfoService/getKIMLdapsUnisAll
