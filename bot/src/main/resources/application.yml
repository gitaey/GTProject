spring:
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

google:
  sheets:
    spreadsheet-id: 1_i5MeUeQkEXX3cwP1_JH-bSqkx-EoE7smbYTxegm0Vk
    credentials-path: classpath:google-credentials.json
    credentials-json: ${GOOGLE_CREDENTIALS_JSON:}
    sheet-name: 레이드일정
    character-sheet-name: 캐릭터

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN:}

lostark:
  api:
    key: ${LOSTARK_API_KEY:}


