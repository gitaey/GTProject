<!doctype html>
<!--
  개발용 standalone 페이지 — frontend/에서 npm run dev:gis-standalone → http://localhost:5199/examples/standalone.html
  src/standalone.ts(UMD 엔트리와 같은 모듈)를 빌드 없이 직접 불러온다. React·Tailwind 없음 — CSS는 엔트리가 import하는
  ol.css + styles/gis-map.css 두 개뿐이다(이 화면이 정상이면 패키지 CSS만으로 코어 DOM이 그려진다는 뜻).
    ?host=mock (기본) 가짜 호스트: 레이어 트리·지역명을 메모리에서 답한다. 백엔드 없이 뜬다
    ?host=real        GTProject 개발 서버에 붙는다: /api → 8080, /proxy → 3000 (vite.config.ts server.proxy). 둘 다 켜져 있어야 한다
  VWorld 키는 아래 입력칸에 넣으면 이 탭에서만 쓴다(파일·저장소에 남기지 않는다).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>gis-map standalone (dev)</title>
<style>
    /* 글자 크기는 body에만 준다 — html(뿌리) 글자 크기를 바꾸면 rem으로 쓴 지도 모듈 CSS(측정 툴팁 등)의 크기도 같이 바뀐다 */
    html, body { margin: 0; height: 100%; }
    body { font-family: "Malgun Gothic", sans-serif; font-size: 14px; color: #222; }
    .dev { display: flex; height: 100%; }
    .dev-side { width: 300px; flex: none; overflow: auto; padding: 12px; border-right: 1px solid #ddd; box-sizing: border-box; background: #fafafa; }
    .dev-side h1 { font-size: 15px; margin: 0 0 4px; }
    .dev-side h2 { font-size: 13px; margin: 14px 0 6px; color: #555; }
    .dev-side button { margin: 0 4px 4px 0; padding: 4px 8px; border: 1px solid #bbb; background: #fff; border-radius: 3px; cursor: pointer; font-size: 12px; }
    .dev-side button.is-on { background: #f26722; border-color: #f26722; color: #fff; }
    .dev-side ul { list-style: none; margin: 0; padding-left: 14px; }
    .dev-side > section > ul { padding-left: 0; }
    .dev-note { color: #777; font-size: 12px; }
    .dev-log { font: 11px/1.4 Consolas, monospace; background: #fff; border: 1px solid #ddd; height: 140px; overflow: auto; padding: 4px; white-space: pre-wrap; }
    .dev-map { flex: 1; position: relative; }
    /* OpenStreetMap 타일 이용 조건: 지도 화면에 저작자 표시. (a) 번들은 OL 저작자 표시 컨트롤을 넣지 않으므로(번들 ol 사본) 페이지가 직접 보인다 */
    .dev-attrib { position: absolute; left: 6px; bottom: 6px; z-index: 1; font: 11px/1.4 Arial, sans-serif; color: #333; background: rgba(255, 255, 255, .8); padding: 1px 5px; border-radius: 3px; }
    .dev-attrib a { color: #0b57d0; }
</style>
</head>
<body>
<div class="dev">
    <aside class="dev-side">
        <h1>gis-map standalone</h1>
        <div class="dev-note">버전 <span id="ver"></span> · 호스트 <b id="mode"></b> · <a id="switch" href="#"></a></div>
        <div class="dev-note">지역명: <span id="region">-</span></div>

        <h2>도구</h2>
        <section id="tools">
            <button type="button" data-tool="draw-point">점</button><button type="button" data-tool="draw-line">선</button><button type="button" data-tool="draw-polygon">면</button><button type="button" data-tool="draw-circle">원</button><button type="button" data-tool="draw-box">사각형</button><button type="button" data-tool="draw-text">텍스트</button><button type="button" data-tool="select">선택</button><br>
            <button type="button" data-tool="measure-distance">거리측정</button><button type="button" data-tool="measure-area">면적측정</button><button type="button" data-tool="radius-search">반경</button><br>
            <button type="button" id="btnClear">전체 지우기</button><button type="button" id="btnRecreate">지도 다시 만들기</button>
        </section>

        <h2>VWorld 키 (선택)</h2>
        <input id="key" type="password" placeholder="이 탭에서만 사용" style="width:100%;box-sizing:border-box">

        <h2>레이어</h2>
        <section id="tree"></section>

        <h2>기록</h2>
        <div id="log" class="dev-log"></div>
    </aside>
    <div id="map" class="gm-root dev-map"><div id="attrib" class="dev-attrib" hidden>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div></div>
</div>
<script type="module">
import * as GisMap from '../src/standalone.ts'

const real = new URLSearchParams(location.search).get('host') === 'real'
const $ = id => document.getElementById(id)
const log = msg => { $('log').textContent += msg + '\n'; $('log').scrollTop = $('log').scrollHeight }

// 가짜 호스트 소스(백엔드 없음). real이면 짝 백엔드 REST + 호스트 프록시 어댑터
const layer = (id, groupId, name, type, url, layerName, visible, extra = {}) => ({
    id, name, type, sourceType: 'OPENAPI', url, layerName, styleName: null, styleConfig: null, format: 'image/png', projection: 'EPSG:3857',
    minZoom: null, maxZoom: null, opacity: 1, visible, sortOrder: id, groupId, groupName: null, description: null, createdAt: '', updatedAt: '', ...extra,
})
const MOCK_TREE = {
    groups: [
        { id: 1, name: '배경지도', parentId: null, sortOrder: 0, children: [], layers: [
            layer(11, 1, 'VWorld 일반(키 필요)', 'XYZ', 'https://api.vworld.kr/req/wmts/1.0.0/{VWORLD_KEY}/Base/{z}/{y}/{x}.png', 'Base', false),
            layer(12, 1, 'VWorld 위성(키 필요)', 'XYZ', 'https://api.vworld.kr/req/wmts/1.0.0/{VWORLD_KEY}/Satellite/{z}/{y}/{x}.jpeg', 'Satellite', false),
        ] },
        { id: 2, name: '참고', parentId: null, sortOrder: 1, children: [], layers: [
            layer(21, 2, 'OpenStreetMap', 'XYZ', 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', 'osm', true, { maxZoom: 19 }),
        ] },
    ],
    ungroupedLayers: [],
}
const MOCK_SOURCES = {
    layerTree: { loadTree: () => Promise.resolve(MOCK_TREE) },
    regionName: { nameAt: (lon, lat) => Promise.resolve(`가짜 지역 (${lon.toFixed(3)}, ${lat.toFixed(3)})`) },
}
const sources = real ? [GisMap.adapters.rest(), GisMap.adapters.proxy()] : MOCK_SOURCES

let map = null
let offs = []
function createMap() {
    map = GisMap.create({
        target: 'map',
        host: {
            http: { credentials: 'same-origin', getHeaders: () => ({}) },
            endpoints: { apiBaseUrl: '', proxyBaseUrl: '/proxy', geoserverUrl: '' },
            keys: { vworld: $('key').value },
        },
        sources,
        view: { center: [127.0276, 37.4979], zoom: 15 },
    })
    GisMap.controls.scaleLine(map)
    if (!real) map.layers.setBasemapMode('none')       // 가짜 호스트는 키가 없으니 OSM만
    offs.push(map.tools.store.subscribe(s => {
        for (const b of document.querySelectorAll('#tools [data-tool]')) b.classList.toggle('is-on', b.dataset.tool === s.activeTool)
    }))
    offs.push(map.layers.store.subscribe(renderTree))
    // OSM 레이어가 보일 때만 저작자 표시(OSM 타일 이용 조건)
    const syncAttribution = () => {
        const st = map.layers.store.getState()
        $('attrib').hidden = !(st.tree && map.layers.allLayers().some(l => l.url.includes('openstreetmap.org') && map.layers.isVisible(l)))
    }
    offs.push(map.layers.store.subscribe(syncAttribution))
    syncAttribution()
    offs.push(map.region.watch())                       // 지역명은 구독(watch)할 때만 moveend마다 조회한다
    offs.push(map.region.store.subscribe(s => { $('region').textContent = s.name ?? '-' }))
    renderTree()
    log('지도 생성 ' + map.id)
}
function renderTree() {
    const s = map.layers.store.getState()
    const box = $('tree')
    box.textContent = ''
    if (!s.tree) { box.textContent = s.error ? '불러오기 실패: ' + s.error : '불러오는 중'; return }
    const list = (groups, layers) => {
        const ul = document.createElement('ul')
        for (const g of groups) {
            const li = document.createElement('li')
            const t = document.createElement('div'); t.textContent = g.name; t.style.fontWeight = 'bold'
            li.append(t, list(g.children, g.layers)); ul.append(li)
        }
        for (const l of layers) {
            const li = document.createElement('li'); const label = document.createElement('label'); const cb = document.createElement('input')
            cb.type = 'checkbox'; cb.checked = map.layers.isVisible(l); cb.dataset.layerId = String(l.id)
            cb.onchange = () => map.layers.toggleLayer(l.id)
            label.append(cb, ' ' + l.name); li.append(label); ul.append(li)
        }
        return ul
    }
    box.append(list(s.tree.groups, s.tree.ungroupedLayers))
}

$('tools').onclick = e => { const t = e.target.dataset && e.target.dataset.tool; if (t) map.tools.activate(t) }
$('btnClear').onclick = () => map.clearAll()
$('btnRecreate').onclick = () => {
    offs.forEach(f => f()); offs = []
    map.destroy()
    log(`destroy 후 레이어 ${map.olMap.getLayers().getLength()} · interaction ${map.olMap.getInteractions().getLength()} · overlay ${map.olMap.getOverlays().getLength()} · control ${map.olMap.getControls().getLength()}`)
    createMap()
}
$('key').onchange = () => { map.setHost({ keys: { vworld: $('key').value } }); log('VWorld 키 교체(setHost) → 레이어 다시 만듦') }
$('ver').textContent = GisMap.version
$('mode').textContent = real ? 'real (8080/3000)' : 'mock'
$('switch').textContent = real ? '가짜 호스트로' : '실제 백엔드로'
$('switch').href = real ? '?host=mock' : '?host=real'
createMap()
</script>
</body>
</html>
